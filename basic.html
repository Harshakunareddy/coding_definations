<script>

        let ch = {};

            ch[i] = (ch[i] || 0) + 1;

    function RemoveDuplicatesWithoutnewSet(arr) {
        let chars = RemoveDuplicatesWithoutnewSetHelper(arr);
        let result = [];

        }

    }

</script>



<script>
    function RemoveDup(arr) {
        let seen = {};
        let result = [];
        for (let i of arr) {
            if (!seen[i]) {
                seen[i] = true;
                result.push(i);
            }
        }
        return result;
    }
    console.log(RemoveDup([1, 0, 1, 2, 3, 5]));
</script>

<script>
    function IsPrimeOrNot(num) {
        if (num <= 1) return false;
        for (let i = 2; i <= Math.sqrt(num); i++) {
            if (num % i == 0) {
                return false;
            }
        }
        console.log(num);
        return true;
    }

    function SumOfPrimeInAnArray(arr) {
        let answer = 0;
        for (let i = 0; i < arr.length; i++) {
            const is_prime = IsPrimeOrNot(arr[i]);
            if (is_prime === true) {
                answer += arr[i];
            }
        }
        return answer;
    }

    console.log(SumOfPrimeInAnArray([1, 2, 3, 4, 5, 6, 7]));
</script>


<script>
    function findMissingNumber(arr, n) {
        let total = (n * (n + 1)) / 2;
        let sum = arr.reduce((a, b) => a + b, 0);
        return total - sum;
    }
    console.log(findMissingNumber([1, 2, 3, 4, 5], 5));
</script>




<script>

1️⃣ Create an Array
An array stores multiple values in one variable.
Values are accessed using index numbers.

let arr = [1, 2, 3];

2️⃣ push()
Adds an element to the end of an array.
Changes the original array.

let arr = [1, 2];
arr.push(3);



3️⃣ pop()

Removes the last element from an array.
Returns the removed element.

let arr = [1, 2, 3];
arr.pop();


4️⃣ unshift()

Adds an element at the beginning.
Moves existing elements forward.

let arr = [2, 3];
arr.unshift(1);

Removes the first element.
Array length reduces.

let arr = [1, 2, 3];
arr.shift();

await pauses execution until the Promise resolves.

async function fetchUser() {
  const data = await getUserFromDB();
  console.log(data);
}


Callback
Error handling is messy
getUser(id, () => {
  getOrders(() => {
    getPayment(() => {
      // 😵 too nested
    });
  });
});

Promise
Error handling across many .then() is harder to track
getUser()
  .then(user => getOrders(user))
  .then(orders => getPayment(orders))
  .then(pay => console.log(pay))
  .catch(err => console.log(err));



Async / Await
Clean & readable code
Looks like synchronous code
Centralized error handling (try/catch)

async function processOrder() {
  try {
    const user = await getUser();
    const orders = await getOrders(user);
    const payment = await getPayment(orders);
    console.log(payment);
  } catch (err) {
    console.log(err);
  }
}


“Callbacks were replaced by Promises,
and async/await makes Promises easier to read and manage.”
