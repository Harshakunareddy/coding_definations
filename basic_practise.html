<script>
    function RemoveDuplicatesWithoutnewSetHelper(arr) {
        let ch = {};
        for (let i of arr) {
            ch[i] = (ch[i] || 0) + 1;
        }
        return ch;
    }
    function RemoveDuplicatesWithoutnewSet(arr) {
        let chars = RemoveDuplicatesWithoutnewSetHelper(arr);
        let result = [];
        for (let i = 0; i < arr.length; i++) {
            if (chars[i] > 0) {
                result.push(i);
                chars[i] = 0;
            }
        }
        return result;
    }
    console.log(RemoveDuplicatesWithoutnewSet([1, 2, 1, 2, 3, 4, 3, 5]));
</script>

<script>
    function RemoveDup(arr) {
        let seen = {};
        let result = [];
        for (let i of arr) {
            if (!seen[i]) {
                seen[i] = true;
                result.push(i);
            }
        }
        return result;
    }
    console.log(RemoveDup([1, 0, 1, 2, 3, 5]));
</script>


<script>
    function PrimeOrNot(n) {
        for (let i = 2; i <= Math.sqrt(num); i++) {
            if ((n % i) == 0) {
                return false;
            }
        }
        return true;
    }
</script>


<script>
    function factorial(n) {
        let a = 1;
        for (let i = 1; i <= n; i++) {
            a *= i;
        }
        return a;
    }
</script>
