<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supra Assistant</title>

  <style>
    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #233;
      background: #eef2f7;
      display: flex;
      flex-direction: column
    }

    header {
      background: #12609e;
      color: #fff;
      padding: 14px 0;
      flex: 0 0 auto
    }

    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 20px;
      width: 100%
    }

    header h1 {
      font-size: 19px;
      margin: 0
    }

    header p {
      margin: 2px 0 0;
      font-size: 12.5px;
      color: #bcd8ef
    }

    main {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 22px 0
    }

    .intro {
      background: #fff;
      border: 1px solid #cfd9e4;
      border-radius: 6px;
      padding: 18px 20px
    }

    .intro h2 {
      margin: 0 0 8px;
      font-size: 16px;
      color: #12609e
    }

    .intro p {
      margin: 0;
      font-size: 14px;
      color: #556
    }

    .turn {
      background: #fff;
      border: 1px solid #cfd9e4;
      border-radius: 6px;
      margin-bottom: 16px;
      overflow: hidden
    }

    .q {
      background: #f4f7fa;
      border-bottom: 1px solid #e3e9f0;
      padding: 11px 16px;
      font-weight: bold;
      color: #12609e
    }

    .inner {
      padding: 16px
    }

    .alert {
      border-left: 4px solid #c0392b;
      background: #fdf2f0;
      padding: 11px 14px;
      margin-bottom: 14px;
      border-radius: 0 4px 4px 0
    }

    .alert strong.hd {
      display: block;
      color: #a5281b;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 6px
    }

    .alert p {
      margin: 0 0 6px
    }

    .alert p:last-child {
      margin: 0
    }

    .answer p {
      margin: 0 0 10px
    }

    .answer ul {
      margin: 0 0 10px;
      padding-left: 22px
    }

    .answer li {
      margin-bottom: 4px
    }

    .answer h4 {
      margin: 14px 0 6px;
      font-size: 13px;
      color: #12609e;
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .answer em {
      color: #6b7a8a;
      font-size: 13.5px
    }

    .answer>*:first-child {
      margin-top: 0
    }

    .answer>*:last-child {
      margin-bottom: 0
    }

    code {
      background: #eef2f7;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 13.5px
    }

    .answer strong {
      color: #1a2b3c
    }

    footer {
      flex: 0 0 auto;
      background: #fff;
      border-top: 1px solid #cfd9e4;
      padding: 12px 0 14px
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 20px 10px;
      max-width: 880px;
      margin: 0 auto;
      scrollbar-width: none
    }

    .chips::-webkit-scrollbar {
      display: none
    }

    .chips::-webkit-scrollbar-thumb {
      background: #c3cfdb;
      border-radius: 3px
    }

    .chips button {
      flex: 0 0 auto;
      white-space: nowrap;
      padding: 7px 14px;
      font-size: 13px;
      background: #f4f7fa;
      color: #12609e;
      border: 1px solid #d6e0ea;
      border-radius: 16px;
      cursor: pointer
    }

    .chips button:hover {
      background: #e6eef6;
      border-color: #12609e
    }

    form {
      display: flex;
      gap: 8px
    }

    input[type=text] {
      flex: 1 1 auto;
      min-width: 0;
      padding: 11px 14px;
      font-size: 15px;
      border: 1px solid #a9b8c8;
      border-radius: 22px
    }

    input[type=text]:focus {
      outline: none;
      border-color: #12609e;
      box-shadow: 0 0 0 2px #d6e6f4
    }

    form button {
      flex: 0 0 auto;
      padding: 11px 26px;
      font-size: 15px;
      border-radius: 22px;
      cursor: pointer;
      background: #12609e;
      color: #fff;
      border: 1px solid #12609e
    }

    form button:hover {
      background: #0e4d80
    }

    form button:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    .status {
      font-size: 11.5px;
      color: #7a8b9d;
      margin: 8px 0 0;
      text-align: center
    }

    .loading {
      color: #7a8b9d;
      font-style: italic;
      margin: 0
    }

    .degraded {
      margin: 0 0 12px;
      padding: 8px 12px;
      background: #fff8e6;
      border-left: 4px solid #d9a300;
      border-radius: 0 4px 4px 0;
      font-size: 13px;
      color: #7a5c00
    }

    @media(max-width:600px) {

      .wrap,
      .chips {
        padding-left: 12px;
        padding-right: 12px
      }

      form button {
        padding: 11px 18px
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="wrap">
      <h1>Supra Assistant</h1>
      <p>Supra Multi-Specialty Hospital, Hyderabad &middot; Clinical Decision Support</p>
    </div>
  </header>

  <main id="main">
    <div class="wrap" id="msgs">

      <div class="intro" id="intro">
        <h2>Ask about Supra Hospital protocol</h2>
        <p>Answers are drawn from Supra's own ratified protocols and checked against the
          hospital's clinical safety rules before they are shown.</p>
      </div>

    </div>
  </main>

  <footer>
    <div class="chips" id="chips"></div>

    <div class="wrap">
      <form id="f">
        <label for="q" class="sr-only" style="position:absolute;left:-9999px">Your question</label>

        <input id="q" type="text" autocomplete="off" autofocus maxlength="1000"
          placeholder="Ask about Supra Hospital protocol">

        <button id="send" type="submit">Ask</button>
      </form>

      <p class="status" id="status"></p>
    </div>
  </footer>

  <script>
    const $ = id => document.getElementById(id);

    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function md(t) {
      let h = esc(t);

      h = h.replace(/^\s*#{1,6}\s*(.+)$/gm, '<h4>$1</h4>');

      h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

      h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

      h = h.replace(/`([^`]+)`/g, '<code>$1</code>');

      h = h.replace(/^\s*[-•]\s+(.+)$/gm, '<li>$1</li>');

      h = h.replace(/^\s*\d+\.\s+(.+)$/gm, '<li>$1</li>');

      h = h.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, m => '<ul>' + m + '</ul>');

      h = h.replace(/<\/ul>\s*<ul>/g, '');

      h = h.replace(/^---$/gm, '');

      return h.split(/\n{2,}/).filter(b => b.trim())
        .map(b => /^<(h4|ul)/.test(b.trim()) ? b : '<p>' + b.replace(/\n/g, '<br>') + '</p>').join('');
    }

    function scrollToBottom() { $('main').scrollTop = $('main').scrollHeight; }

    async function boot() {
      try {
        const b = await (await fetch('/api/bootstrap')).json();
        const l = b.llm;

        if (!l.configured) {
          $('status').textContent = 'No model configured — answering directly from Supra protocols';
        } else if (l.reachable === false) {
          $('status').textContent = l.provider + ' unavailable (' + l.detail + ') — answering directly from Supra protocols';
        } else {
          $('status').textContent = 'Model: ' + l.provider + ' · ' + l.model;
        }

        $('chips').innerHTML = b.test_queries
          .map(q => '<button type="button">' + esc(q) + '</button>').join('');
      } catch {
        $('status').textContent = 'Could not reach the server';
      }
    }

    $('chips').onclick = e => {
      if (e.target.tagName === 'BUTTON') {
        $('q').value = e.target.textContent.trim();
        $('f').requestSubmit();
      }
    };

    function render(turn, q, g) {
      let alert = '';

      let degraded = '';
      if (g.mode === 'deterministic_fallback') {
        degraded = '<p class="degraded">Language model unavailable' +
          (g.llm_error ? ' (' + esc(g.llm_error) + ')' : '') +
          '. This answer was assembled directly from Supra protocol and safety rules.</p>';
        $('status').textContent = 'Language model unavailable — answering directly from Supra protocols';
      }

      turn.innerHTML = '<div class="q">' + esc(q) + '</div><div class="inner">' + alert + degraded +
        '<div class="answer">' + md(g.answer) + '</div></div>';
    }

    $('f').onsubmit = async e => {
      e.preventDefault();

      const q = $('q').value.trim();
      if (!q) return;

      $('q').value = '';
      $('send').disabled = true;

      const intro = $('intro');
      if (intro) intro.remove();

      const turn = document.createElement('div');
      turn.className = 'turn';
      turn.innerHTML = '<div class="q">' + esc(q) +
        '</div><div class="inner"><p class="loading">Checking Supra protocols...</p></div>';
      $('msgs').appendChild(turn);
      scrollToBottom();

      try {
        const r = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q }),
          signal: AbortSignal.timeout(45000)
        });

        const data = await r.json();

        if (data.error) throw new Error(data.error);

        render(turn, q, data.governed);

      } catch (err) {
        const msg = err.name === 'TimeoutError' ? 'The request timed out. Please try again.' : err.message;
        turn.innerHTML = '<div class="q">' + esc(q) + '</div><div class="inner"><div class="alert">' +
          '<strong class="hd">Request failed</strong><p>' + esc(msg) + '</p></div></div>';
      }

      $('send').disabled = false;
      scrollToBottom();
      $('q').focus();
    };

    boot();
  </script>
</body>

</html>
